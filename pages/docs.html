<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPERA AI — Documentation</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--black:#080808;--white:#f4f4f0;--gray:#111;--gray2:#1a1a1a;--muted:#888;--accent:#c8ff00;--border:#222}
body{background:var(--black);color:var(--white);font-family:'Space Grotesk',sans-serif;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid var(--border);background:rgba(8,8,8,.95)}
.logo{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--white)}
.logo span{color:var(--accent)}
.main{max-width:800px;margin:0 auto;padding:80px 40px}
h1{font-size:32px;font-weight:700;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:40px}
.doc-grid{display:grid;gap:16px}
.doc-card{padding:28px 32px;background:var(--gray);border:1px solid var(--border);transition:border-color .2s;cursor:pointer}
.doc-card:hover{border-color:var(--accent)}
.doc-card h3{font-size:16px;font-weight:500;margin-bottom:8px}
.doc-card p{color:var(--muted);font-size:13px;line-height:1.6}
.back{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:40px;display:block}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">OPERA<span>_AI</span></a>
  <div><a href="/" style="color:var(--muted);text-decoration:none;font-size:12px">← Back to Home</a></div>
</nav>
<div class="main">
  <a href="/" class="back">← Back to Home</a>
  <h1>Documentation</h1>
  <p class="sub">OPERA AI 설치부터 고급 사용법까지</p>
  <div class="doc-grid">
    <a href="/install-guide" class="doc-card"><h3>📥 설치 가이드</h3><p>Windows/Mac에 OPERA AI를 설치하는 방법을 단계별로 안내합니다.</p></a>
    <a href="/user-manual" class="doc-card"><h3>📖 사용자 매뉴얼</h3><p>모든 기능 설명, 명령어 가이드, 스킬 사용법을 제공합니다.</p></a>
    <a href="/troubleshooting" class="doc-card"><h3>🔧 문제 해결 가이드</h3><p>자주 발생하는 문제와 해결 방법을 확인하세요.</p></a>
    <a href="/api/docs" class="doc-card"><h3>🔌 API 문서</h3><p>개발자를 위한 REST API 엔드포인트 문서입니다.</p></a>
  </div>
</div>
</body>
</html>
