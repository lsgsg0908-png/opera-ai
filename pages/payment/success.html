<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPERA AI — Payment Success</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:#f4f4f0;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}.card{max-width:440px;width:100%;background:#111;border:1px solid #222;padding:48px 40px;text-align:center}.icon{font-size:48px;margin-bottom:24px}.card h1{font-size:28px;font-weight:700;margin-bottom:12px;color:#22d3a0}.card p{color:#888;font-size:14px;line-height:1.7;margin-bottom:32px}.btn{display:inline-block;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1px;background:#c8ff00;color:#080808;padding:14px 32px;text-decoration:none}</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Payment Successful!</h1>
  <p>Your OPERA AI subscription is now active.<br>Check your email for license key and download instructions.<br>You can close this window.</p>
  <a href="https://opera.workbotai.net/dashboard" class="btn">GO TO DASHBOARD →</a>
</div>
<script>
// PayPal redirect contains token in URL params
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
if (token) {
  fetch('/api/paypal/capture-order', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({paypal_order_id: token})
  }).then(r => r.json()).then(d => {
    console.log('Payment captured:', d);
  });
}
</script>
</body>
</html>
